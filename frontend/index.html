<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aoike Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #fafafa;
            --card: #ffffff;
            --border: #e4e4e7;
            --text: #18181b;
            --text-muted: #71717a;
            --accent: #18181b;
            --radius: 0.75rem;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
        }

        .dashboard {
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            gap: 1.25rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            padding-bottom: 0.5rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .subtitle {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
        }

        .stat-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.25rem;
        }

        .stat-label {
            font-size: 0.75rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.25rem;
            flex: 1;
            min-height: 0;
        }

        .panel {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .panel-header {
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .chart-container {
            flex: 1;
            position: relative;
            min-height: 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.875rem;
        }

        th {
            text-align: left;
            padding: 0.625rem 0.75rem;
            font-weight: 500;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        td {
            padding: 0.625rem 0.75rem;
            border-bottom: 1px solid var(--border);
        }

        tr:last-child td {
            border-bottom: none;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 0.25rem 0.5rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 0.375rem;
            font-size: 0.75rem;
            font-weight: 500;
            font-family: monospace;
        }

        .percentage {
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        .count {
            font-weight: 600;
            text-align: right;
        }

        footer {
            text-align: center;
            padding-top: 0.5rem;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        @media (max-width: 900px) {
            .stats-row {
                grid-template-columns: repeat(2, 1fr);
            }
            .main-content {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <header>
            <h1>Aoike Dashboard</h1>
            <span class="subtitle">Real-time vault statistics</span>
        </header>

        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-label">Total Files</div>
                <div class="stat-value" id="total-files">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">File Types</div>
                <div class="stat-value" id="total-types">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Top Type</div>
                <div class="stat-value" id="top-type" style="font-size: 1.25rem;">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Status</div>
                <div class="stat-value" style="font-size: 1rem; color: var(--text-muted); padding-top: 0.5rem;">
                    <span id="status-indicator" style="display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #22c55e; margin-right: 0.5rem;"></span>
                    Live
                </div>
            </div>
        </div>

        <div class="main-content">
            <div class="panel">
                <div class="panel-header">Distribution</div>
                <div class="chart-container">
                    <canvas id="stats-chart"></canvas>
                </div>
            </div>

            <div class="panel">
                <div class="panel-header">Breakdown</div>
                <div style="overflow-y: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th>Type</th>
                                <th style="text-align: right;">Count</th>
                                <th style="text-align: right;">Share</th>
                            </tr>
                        </thead>
                        <tbody id="stats-tbody">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <footer>
            Aoike v0.1.0
        </footer>
    </div>

    <script src="/app.js"></script>
</body>
</html>
