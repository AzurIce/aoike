<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aoike Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #fafafa;
            --card: #ffffff;
            --border: #e4e4e7;
            --text: #18181b;
            --text-muted: #71717a;
            --accent: #18181b;
            --radius: 0.75rem;
            --success: #22c55e;
            --warning: #f59e0b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
        }

        .dashboard {
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            gap: 1.25rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            padding-bottom: 0.5rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .subtitle {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .tabs {
            display: flex;
            gap: 0.5rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0;
        }

        .tab {
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-muted);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }

        .tab:hover {
            color: var(--text);
        }

        .tab.active {
            color: var(--text);
            border-bottom-color: var(--accent);
        }

        .tab-content {
            display: none;
            flex: 1;
            min-height: 0;
            overflow-y: auto;
        }

        .tab-content.active {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
        }

        .stat-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.25rem;
        }

        .stat-label {
            font-size: 0.75rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.25rem;
            flex: 1;
            min-height: 0;
        }

        .panel {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .panel-header {
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .chart-container {
            flex: 1;
            position: relative;
            min-height: 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.875rem;
        }

        th {
            text-align: left;
            padding: 0.625rem 0.75rem;
            font-weight: 500;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        td {
            padding: 0.625rem 0.75rem;
            border-bottom: 1px solid var(--border);
        }

        tr:last-child td {
            border-bottom: none;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 0.25rem 0.5rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 0.375rem;
            font-size: 0.75rem;
            font-weight: 500;
            font-family: monospace;
        }

        .percentage {
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        .count {
            font-weight: 600;
            text-align: right;
        }

        /* Task styles */
        .task-filters {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .filter-btn {
            padding: 0.375rem 0.75rem;
            font-size: 0.75rem;
            font-weight: 500;
            border: 1px solid var(--border);
            border-radius: 0.375rem;
            background: var(--card);
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-btn:hover {
            border-color: var(--text-muted);
            color: var(--text);
        }

        .filter-btn.active {
            background: var(--text);
            color: var(--card);
            border-color: var(--text);
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            overflow-y: auto;
            flex: 1;
        }

        .task-item {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            padding: 0.75rem;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            transition: all 0.2s;
        }

        .task-item:hover {
            border-color: var(--text-muted);
        }

        .task-checkbox {
            width: 1.25rem;
            height: 1.25rem;
            border: 2px solid var(--border);
            border-radius: 0.25rem;
            flex-shrink: 0;
            margin-top: 0.125rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
        }

        .task-item.done .task-checkbox {
            background: var(--success);
            border-color: var(--success);
            color: white;
        }

        .task-content {
            flex: 1;
            min-width: 0;
        }

        .task-text {
            font-size: 0.875rem;
            line-height: 1.5;
            word-break: break-word;
        }

        .task-item.done .task-text {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .task-meta {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.375rem;
            flex-wrap: wrap;
        }

        .task-tag {
            font-size: 0.6875rem;
            padding: 0.125rem 0.375rem;
            border-radius: 0.25rem;
            background: var(--bg);
            color: var(--text-muted);
        }

        .task-file {
            font-size: 0.6875rem;
            color: var(--text-muted);
            font-family: monospace;
        }

        .task-priority-high {
            color: #ef4444;
        }

        .task-priority-medium {
            color: var(--warning);
        }

        .task-priority-low {
            color: var(--success);
        }

        footer {
            text-align: center;
            padding-top: 0.5rem;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        @media (max-width: 900px) {
            .stats-row {
                grid-template-columns: repeat(2, 1fr);
            }
            .main-content {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <header>
            <h1>Aoike Dashboard</h1>
            <span class="subtitle">Real-time vault statistics</span>
        </header>

        <div class="tabs">
            <div class="tab active" data-tab="stats">Statistics</div>
            <div class="tab" data-tab="tasks">Tasks</div>
        </div>

        <!-- Stats Tab -->
        <div class="tab-content active" id="stats-tab">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Total Files</div>
                    <div class="stat-value" id="total-files">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">File Types</div>
                    <div class="stat-value" id="total-types">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Top Type</div>
                    <div class="stat-value" id="top-type" style="font-size: 1.25rem;">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Status</div>
                    <div class="stat-value" style="font-size: 1rem; color: var(--text-muted); padding-top: 0.5rem;">
                        <span id="status-indicator" style="display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #22c55e; margin-right: 0.5rem;"></span>
                        Live
                    </div>
                </div>
            </div>

            <div class="main-content">
                <div class="panel">
                    <div class="panel-header">Distribution</div>
                    <div class="chart-container">
                        <canvas id="stats-chart"></canvas>
                    </div>
                </div>

                <div class="panel">
                    <div class="panel-header">Breakdown</div>
                    <div style="overflow-y: auto;">
                        <table>
                            <thead>
                                <tr>
                                    <th>Type</th>
                                    <th style="text-align: right;">Count</th>
                                    <th style="text-align: right;">Share</th>
                                </tr>
                            </thead>
                            <tbody id="stats-tbody">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tasks Tab -->
        <div class="tab-content" id="tasks-tab">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Total Tasks</div>
                    <div class="stat-value" id="total-tasks">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">To Do</div>
                    <div class="stat-value" id="todo-count" style="color: var(--warning);">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Done</div>
                    <div class="stat-value" id="done-count" style="color: var(--success);">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Completion</div>
                    <div class="stat-value" id="completion-rate">-</div>
                </div>
            </div>

            <div class="panel" style="flex: 1;">
                <div class="panel-header">Task List</div>
                <div class="task-filters">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="todo">To Do</button>
                    <button class="filter-btn" data-filter="done">Done</button>
                </div>
                <div class="task-list" id="task-list">
                </div>
            </div>
        </div>

        <footer>
            Aoike v0.1.0
        </footer>
    </div>

    <script src="/app.js"></script>
</body>
</html>
