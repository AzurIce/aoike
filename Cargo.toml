[package]
name = "aoike"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "aoike"
path = "src/main.rs"

[workspace]
members = ["crates/*"]
resolver = "3"

[dependencies]
aoike-core = { path = "crates/aoike-core" }
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.45", features = ["full"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
